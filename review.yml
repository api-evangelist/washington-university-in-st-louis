  - date: '2026-06-03'
    rating: 2
    summary: >-
      WashU runs a real enterprise API program via MuleSoft Anypoint Exchange
      ("Data at WashU") covering Person, Financial, Supplier, Location,
      Academic, and Organization domains, but access is gated and requires a
      ServiceNow request limited to WashU integrators — no open public
      endpoints or sign-up. The Becker School of Medicine Digital Commons Data
      repository (Elsevier/Mendeley Data) exposes a live OAI-PMH endpoint and
      an API docs page that resolve publicly. The GitHub org github.com/wustl
      exists but holds only two forked research repos. No public open-data
      portal, no documented course/SIS API was confirmed. All listed entries
      reflect verified URLs; no endpoints were fabricated.
