description: >-
  Washington University in St. Louis is a non-commercial higher-education institution and sells no
  API. Exactly one surface is free and self-service: CIViC, the McDonnell Genome Institute
  knowledgebase, reads anonymously over GraphQL and issues a free API key to any signed-in user for
  writes and a higher rate ceiling, with all content released CC0. The OAI-PMH endpoints on the two
  Elsevier-operated research repositories harvest free and unauthenticated. Everything else is not
  priced but gated: the MuleSoft Anypoint enterprise APIs are granted by internal ServiceNow
  request to WashU integrators, and CNDA and BALSA require an account. Access here is a function of
  institutional affiliation and federation membership, not payment.
notes: >-
  No published per-seat or per-call commercial pricing anywhere in the estate. "Free / Open"
  reflects the genuinely open endpoints — CIViC's GraphQL API and the two OAI-PMH harvest
  interfaces. "Affiliation / Credentialed" reflects access gated by institutional identity rather
  than payment. No earlier claim of library or course APIs survived re-probing; neither exists.
