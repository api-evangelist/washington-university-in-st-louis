      because none is publicly readable: every path probed, including the XNAT REST root /data/version
      and the OpenAPI document at /xapi/swagger.json, returns the same 23,725-byte login page at
      /app/template/Login.vm with HTTP 200. That is a soft-200 gate — a success code wrapping a
      sign-in form — and it is recorded as such rather than counted as an available API.
    humanURL: https://cnda.wustl.edu/
    tags: [ Neuroimaging, Research Computing, XNAT, Research Data, Gated, School of Medicine ]
    properties:
      - type: Website
        url: https://cnda.wustl.edu/
      - type: Authentication
        url: authentication/washington-university-in-st-louis-authentication.yml

  - aid: washington-university-in-st-louis:balsa
    name: BALSA Neuroimaging Database
    x-operator: institution
    description: >-
      A WashU-operated database of neuroimaging scenes and datasets at balsa.wustl.edu, and now the
