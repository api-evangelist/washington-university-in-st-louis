    name: CNDA — Central Neuroimaging Data Archive (XNAT)
    x-operator: institution
    description: >-
      WashU's neuroimaging data archive, running XNAT — imaging informatics software that originated
      at the university's own Neuroinformatics Research Group. cnda.wustl.edu resolves inside WashU's
