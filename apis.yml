aid: washington-university-in-st-louis
name: Washington University in St. Louis
description: >-
  Washington University in St. Louis (WashU) is a private research university
  in St. Louis, Missouri, ranked #171 in the QS World University Rankings 2025.
  Its public developer footprint is modest: WashU operates an enterprise API
  program ("Data at WashU") delivered through MuleSoft Anypoint Exchange,
  exposing institutional APIs (Person, Financial, Supplier, Location, Academic,
  Organization) that are gated and require access requests through ServiceNow
  for WashU integrators rather than open public consumption. The Becker Medical
  Library School of Medicine runs a Digital Commons Data (Elsevier/Mendeley
  Data) research repository that exposes an OAI-PMH endpoint and API docs. Most
  other surfaces (course catalog, registrar) are web applications rather than
  documented public APIs.
