x-coverage:
  state: covered
  reason: covered
  detail: >-
    Every class this pipeline hunts was probed on 2026-09-01 and the institution turned out to hold
    one genuinely public, institution-engineered API — which is more than the June 2026 profile
    found and more than most of this cohort has. CIViC's GraphQL endpoint answered an
    unauthenticated introspection query with HTTP 200 and a complete 502-type schema, which is saved
    here as a probed contract; its own documentation attributes it to "The McDonnell Genome
    Institute at Washington University School of Medicine", which is what settles the operator,
    since civicdb.org is an independent project domain no hostname rule can read. WashU's Shibboleth
    IdP entity resolved in the InCommon MDQ service as signed SAML 2.0 metadata scoped to wustl.edu.
    Both OAI-PMH endpoints answered Identify, ListMetadataFormats and ListSets, and DNS resolution
    is what demoted them from institution to tenant: openscholarship.wustl.edu CNAMEs to
    dcwustlmain.bepress.com with adminEmail dc-support@elsevier.com, and digitalcommonsdata.wustl.edu
    CNAMEs to www.data.mendeley.com. The June 2026 profile recorded both as institution-owned on the
    strength of the wustl.edu label alone; that is corrected here. The enterprise MuleSoft program is
    real and completely closed — the portal pages are public, nothing behind them is. Two research
    platforms, CNDA (XNAT) and BALSA, are WashU-operated but return a login page to every request,
    CNDA doing so as a soft 200 at /app/template/Login.vm even for /xapi/swagger.json, so no contract
    was taken from them. Not found, after looking: any open-data portal, any course or registrar API
    (courses.wustl.edu now fails to connect entirely, having returned 200 in June), any llms.txt,
    any /.well-known/security.txt, any status page, and any Crossref or ORCID institutional surface.
    library.washu.edu and catalog.wustl.edu sit behind a Cloudflare bot challenge — a finding about
    their edge, not a gap in their publishing, and not an API in any case.
