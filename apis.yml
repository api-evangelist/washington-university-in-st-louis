apis:
  - aid: washington-university-in-st-louis:civic
    name: CIViC — Clinical Interpretation of Variants in Cancer
    x-operator: institution
    description: >-
      A free, open, community-curated knowledgebase of the clinical significance of variants in
      cancer, built and operated by The McDonnell Genome Institute at Washington University School
      of Medicine and released under CC0 1.0. The public GraphQL API is the live contract: 502 named
      types, 112 root query fields covering molecular profiles, variants, features, evidence items,
      assertions, diseases, therapies, phenotypes, clinical trials, ACMG and ClinGen code
      vocabularies and data releases, and 47 mutations that expose the whole expert curation
      workflow — submit evidence, suggest and moderate revisions, approve assertions, and mint or
      revoke the caller's own API keys. Reads are anonymous; writes and higher rate ceilings take a
      free bearer-token key. The operator documents 3 requests/second over a five-minute window for
      anonymous callers and directs bulk consumers to CIViCpy. The former V1 REST API is documented
      as deprecated and no longer available. Operator is institution, not vendor: civicdb.org is an
      independent project domain, so the attribution rests on what the contract's own documentation
      says about itself, exactly as the ownership check requires.
    humanURL: https://civicdb.org/
    baseURL: https://civicdb.org/api/graphql
    tags: [ Genomics, Bioinformatics, Cancer, Knowledgebase, GraphQL, Research, Open Data, CC0 ]
    properties:
      - type: GraphQL
        url: graphql/washington-university-in-st-louis-civic-schema.graphql
      - type: Documentation
        url: graphql/washington-university-in-st-louis-civic.md
      - type: APIReference
        url: https://docs.civicdb.org/en/latest/api.html
      - type: Console
        url: https://civicdb.org/api/graphiql
      - type: Authentication
        url: authentication/washington-university-in-st-louis-authentication.yml
      - type: RateLimits
        url: rate-limits/washington-university-in-st-louis-rate-limits.yml
      - type: SourceCode
        url: https://github.com/griffithlab/civic-v2

  - aid: washington-university-in-st-louis:enterprise-apis
    name: WashU Enterprise Integration APIs (MuleSoft Anypoint)
    x-operator: institution
    description: >-
      Institutional integration APIs published in a MuleSoft Anypoint Exchange tenant and described
      publicly as "Data at WashU", covering the Person, Financial, Supplier, Location, Academic and
      Organization data domains. WashU engineers these APIs over its own systems, which is why the
      operator is institution and not tenant even though the delivery platform is MuleSoft's. They
      are nonetheless entirely closed to the public: integrators request Anypoint Exchange access
      through ServiceNow and are drawn from the WashU community, no specification or endpoint is
      published, and there is no self-service sign-up. Nothing has been saved as a contract here
      because nothing is publicly readable. A resolving host audit reads data.wustl.edu as a
      CampusPress tenant, and it is right about that host — data.wustl.edu is only where the program
      is DOCUMENTED, a WordPress site. The APIs themselves are WashU-built services over WashU
      systems, fronted by a MuleSoft Anypoint tenant, which is why the operator here is institution.
      The distinction is recorded rather than left for a future reader to re-litigate.
    humanURL: https://data.wustl.edu/api-portal/
    tags: [ Integration, Enterprise, MuleSoft, Identity, Finance, Gated, Registrar ]
    properties:
      - type: Documentation
        url: https://data.wustl.edu/api-portal/
      - type: Documentation
        url: https://data.wustl.edu/api-portal/api-portal-how-to-documents/
      - type: Signup
        url: https://data.wustl.edu/api-portal/api-portal-anypoint-access/
      - type: DeveloperPortal
        url: https://anypoint.mulesoft.com/exchange/portals/wustl/

  - aid: washington-university-in-st-louis:incommon-idp
    name: WashU Shibboleth Identity Provider (InCommon)
    x-operator: federation
    description: >-
      Washington University's own SAML 2.0 identity provider, entityID
      https://login.wustl.edu/idp/shibboleth, published as signed metadata through the InCommon
      per-entity metadata query service. The document carries an IDPSSODescriptor and an
      AttributeAuthorityDescriptor, HTTP-POST and HTTP-Redirect SingleSignOnService endpoints under
      login.wustl.edu, a shibmd:Scope of wustl.edu, and two opt-in assurance commitments the
      institution chose to make — the REFEDS Research & Scholarship entity category and SIRTFI
      incident-response certification. login.wustl.edu resolves to idm3-loginprod.g.wustl.edu,
      inside WashU's own network. A federation is shared by definition; the IdP behind this entry
      is not, and it is the strongest institution-operated machine-readable surface WashU has.
    humanURL: https://it.washu.edu/
    baseURL: https://mdq.incommon.org/entities/
    tags: [ Identity Federation, Shibboleth, SAML, InCommon, Single Sign-On, REFEDS ]
    properties:
      - type: IdentityFederation
        url: https://mdq.incommon.org/entities/https%3A%2F%2Flogin.wustl.edu%2Fidp%2Fshibboleth
      - type: Conformance
