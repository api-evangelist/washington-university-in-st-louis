description: >-
  Washington University in St. Louis (WashU) is a private research university in St. Louis,
  Missouri, now presenting itself on washu.edu with the historic wustl.edu domain redirecting to it.
  Its programmable footprint is small but, unusually for this cohort, not empty and not entirely
  someone else's: the McDonnell Genome Institute at WashU School of Medicine builds and operates
  CIViC, the Clinical Interpretation of Variants in Cancer knowledgebase, whose public GraphQL API
  at civicdb.org/api/graphql answers anonymous introspection with a 502-type schema, 112 root
  queries and 47 mutations, documents a bearer-token API key and a 3 request/second rate limit, and
  is released CC0. WashU also operates its own Shibboleth SAML 2.0 identity provider, published as
  signed metadata in InCommon with REFEDS Research & Scholarship and SIRTFI assurance — machine
  readable institutional infrastructure almost no university in this cohort catalogues. Its
  enterprise integration APIs (Person, Financial, Supplier, Location, Academic, Organization) are
  real but wholly gated: they live in a MuleSoft Anypoint Exchange tenant and access is granted by
  internal ServiceNow request, with no public specification, endpoint or sign-up. Everything else is
  a relationship rather than WashU engineering. The two research repositories that harvest cleanly
  over OAI-PMH 2.0 — the WashU Scholarly Repository and Digital Commons Data@Becker — both sit on
  wustl.edu hostnames that CNAME straight to Elsevier infrastructure (bepress and Mendeley Data),
  so the data and the DOIs are WashU's and the contracts are Elsevier's. WashU is a DataCite direct
  member with two registered repositories. There is no public open-data portal, no documented course
  or SIS API, and courses.wustl.edu no longer answers at all.
